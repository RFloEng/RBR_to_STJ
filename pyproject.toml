[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rbr2stj"
version = "0.1.0"
description = "Convert Richard Burns Rally stages (classic and BTB) to STJ (Standard Track JSON) packages"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
dependencies = ["usd-core>=24.0", "jsonschema>=4.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
rbr2stj = "rbr2stj.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
